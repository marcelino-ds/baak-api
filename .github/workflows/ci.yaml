name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PDF_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber==0.11.9
      - run: go test -race -count=1 -timeout=75s -cover ./...
      - run: go vet ./...
      - run: go build ./...
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t baak-api:ci .
      - name: Check PDF extraction in the production image
        run: >-
          docker run --rm --user flaresolverr --entrypoint /usr/local/bin/python
          -v "$PWD/scripts/smoke_pdf.py:/tmp/smoke_pdf.py:ro"
          baak-api:ci /tmp/smoke_pdf.py
      - name: Check API and FlareSolverr readiness
        run: |
          docker run -d --name baak-api-ci -p 127.0.0.1:18080:8080 baak-api:ci
          trap 'docker logs baak-api-ci; docker stop -t 60 baak-api-ci; docker rm baak-api-ci' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:18080/ready
          curl --fail --max-time 5 http://127.0.0.1:18080/live
